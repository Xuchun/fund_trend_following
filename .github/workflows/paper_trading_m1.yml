name: Paper Trading M1 — Daily Update

on:
  schedule:
    # 23:00 UTC = 7:00 PM ET (summer/EDT) = 6:00 PM ET (winter/EST)
    # 2+ hours after US market close (4:00 PM ET) — ensures Yahoo Finance EOD data is available
    - cron: '0 23 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD（留空则自动检测最新交易日）'
        required: false
        default: ''

permissions:
  contents: write    # needed to push positions.json back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy anthropic

      - name: Run paper trading daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/scripts/paper_trading_daily.py

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/paper_trading/positions.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "auto: paper trading M1 $(date -u +%Y-%m-%d)" && git push
