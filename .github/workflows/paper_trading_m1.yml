name: Paper Trading M1 — Daily Update

on:
  schedule:
    # Primary:  01:00 UTC = 09:00 SGT — first daily attempt
    # Backup:   07:00 UTC = 15:00 SGT — second attempt if primary was dropped
    #   The retry workflow now uses a separate concurrency group so it no longer
    #   blocks primary. The backup cron remains as a safety net for GitHub's
    #   own scheduler unreliability (rare cron drops under high load).
    # Day-of-week 2-6 (Tue-Sat UTC) = Mon-Fri ET previous trading day.
    # Duplicate-run guard in the script ensures only one full update runs per day.
    - cron: '0 1 * * 2-6'
    - cron: '0 7 * * 2-6'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD（留空则自动检测最新交易日）'
        required: false
        default: ''

concurrency:
  group: paper-trading-m1
  cancel-in-progress: false

permissions:
  contents: write    # needed to push positions.json back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy anthropic "pandas-market-calendars>=4.4.0,<5.0"

      - name: Run paper trading daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python src/scripts/paper_trading_daily.py --date "${{ github.event.inputs.date }}"
          else
            python src/scripts/paper_trading_daily.py
          fi

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/paper_trading/positions.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "auto: paper trading M1 $(date -u +%Y-%m-%d)" && \
            git pull --rebase && git push
