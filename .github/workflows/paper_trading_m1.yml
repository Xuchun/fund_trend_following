name: Paper Trading M1 — Daily Update

on:
  schedule:
    # 01:00 UTC = 09:00 SGT (UTC+8) = 21:00 ET previous day (EDT) / 20:00 ET (EST)
    # Triggers at 9:00 AM Singapore time. Actual execution may be delayed by GitHub
    # Actions queue (often 1-6 hours). If Yahoo Finance data is not yet available,
    # the no_data_probe mechanism causes the retry workflow to re-attempt hourly.
    # Day-of-week 2-6 (Tue-Sat UTC) = Mon-Fri ET previous trading day.
    - cron: '0 1 * * 2-6'
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD（留空则自动检测最新交易日）'
        required: false
        default: ''

concurrency:
  group: paper-trading-m1
  cancel-in-progress: false

permissions:
  contents: write    # needed to push positions.json back to repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install yfinance pandas numpy anthropic "pandas-market-calendars>=4.4.0,<5.0"

      - name: Run paper trading daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python src/scripts/paper_trading_daily.py --date "${{ github.event.inputs.date }}"
          else
            python src/scripts/paper_trading_daily.py
          fi

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/paper_trading/positions.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "auto: paper trading M1 $(date -u +%Y-%m-%d)" && git push
